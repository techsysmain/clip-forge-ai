# Production-style stack: MySQL + web + worker. Copy .env.example to .env first.
# Start: docker compose up -d --build        Health: http://localhost:3000/api/health
# Storage: by default web and worker share the `storage` volume. To use S3 instead, set STORAGE_DRIVER=s3 and
# the S3_* variables in .env (see README); the volume is then unused.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clipforge
      MYSQL_USER: clipforge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=128M"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://clipforge:${MYSQL_PASSWORD}@db:3306/clipforge
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://clipforge:${MYSQL_PASSWORD}@db:3306/clipforge
      STORAGE_DIR: /data/storage
    ports: ["3000:3000"]
    volumes: [storage:/data/storage]
    depends_on: [worker, db]

volumes:
  dbdata:
  storage:
